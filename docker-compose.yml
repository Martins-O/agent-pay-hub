version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: agentpay
      POSTGRES_USER: agentpay
      POSTGRES_PASSWORD: agentpay
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '900', '1', '--save', '300', '10', '--appendonly', 'no']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  redis-data:
